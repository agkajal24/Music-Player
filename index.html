<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a04c5e46a0.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">

        <div class="music_player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <img src="snowman.jpeg" alt="image" class="song_image">
            <h1 id="song_name">Snowman</h1>
            <p id="artist_name">Sia Kate Isobelle Furler</p>

            
            <audio id="song">

                <source src="Sia - Snowman.mp3" type="audio/mpeg">
            </audio>
            <input type="range" value="0" id="progress">

            <div class="controls">
                <div id="bckBtn"><i class="fa-solid fa-backward"></i></div>
                <div onclick="playPause()"><i class="fa-solid fa-play" id="ctrlIcon"></i></div>
                <div id="frwdBtn"><i class="fa-solid fa-forward"></i></div>
            </div>
        </div>
    </div>
    
<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
